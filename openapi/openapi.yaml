openapi: 3.1.0
info:
  title: Git-Backed Personal Vault API
  description: 'API for accessing and managing a user''s GitHub-backed Markdown vault.


    The user''s private GitHub repository is the canonical source of truth

    for vault contents.


    Clients such as the PWA and future Swift/iOS application communicate

    with the vault through this API.

    '
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://api.aetherius.sanju.fyi
  description: Production API placeholder
tags:
- name: Auth
  description: Authentication and token management
- name: Vault
  description: Vault metadata and information
- name: Files
  description: Vault file operations
- name: Search
  description: Vault search
- name: Sync
  description: Synchronization operations
paths:
  /v1/auth/github-token:
    post:
      operationId: storeGitHubToken
      summary: Store GitHub token server-side
      description: 'Stores the user''s GitHub provider token server-side after OAuth

        authentication. The token is stored securely and used by Edge

        Functions to perform GitHub API operations on behalf of the user.


        This endpoint should be called once after the OAuth callback.

        Subsequent API calls use JWT-only authentication.

        '
      tags:
      - Auth
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreTokenRequest'
      responses:
        '200':
          description: Token stored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenResponse'
                  error:
                    type: ["object", "null"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/vault:
    get:
      operationId: getVault
      summary: Get the current user's vault
      description: 'Returns metadata about the authenticated user''s vault.


        Vault contents themselves remain in the user''s private GitHub

        repository.

        '
      tags:
      - Vault
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Vault metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Vault'
                  error:
                    type: ["object", "null"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No vault has been configured for the user
    post:
      operationId: createVault
      summary: Create or connect a private vault
      description: 'Creates a new private GitHub repository for the user''s vault

        and stores the metadata in the database.

        '
      tags:
      - Vault
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVaultRequest'
      responses:
        '201':
          description: Vault created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Vault'
                  error:
                    type: ["object", "null"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A vault already exists for this user
    patch:
      operationId: updateVaultBranch
      summary: Select an existing vault branch
      description: Verifies the branch exists on GitHub before updating the authenticated user's vault metadata.
      tags: [Vault]
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              properties:
                branch:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Updated vault metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Vault'
                  error:
                    type: [object, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Vault or branch not found
  /v1/files:
    get:
      operationId: listFiles
      summary: List vault files
      description: 'Returns files and directories available in the user''s vault.

        '
      tags:
      - Files
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Path'
      - $ref: '#/components/parameters/ExpectedBranch'
      responses:
        '200':
          description: Files and directories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/FileList'
                  error:
                    type: ["object", "null"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Vault or path was not found
    post:
      operationId: createFile
      summary: Create a file
      description: 'Creates a new file in the user''s vault and commits the change

        to the user''s GitHub repository.

        '
      tags:
      - Files
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFileRequest'
      responses:
        '201':
          description: File created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/File'
                  error:
                    type: ["object", "null"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: File already exists
  /v1/files/move:
    post:
      operationId: moveFile
      summary: Atomically rename or move a file
      description: Creates one Git commit that removes the source and adds the destination. A non-force branch advance rejects concurrent branch changes; failed publication never exposes a partial move.
      tags: [Files]
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, expectedSha]
              properties:
                from:
                  type: string
                  minLength: 1
                to:
                  type: string
                  minLength: 1
                expectedBranch:
                  $ref: '#/components/schemas/ExpectedBranch'
                expectedSha:
                  type: string
                  minLength: 1
                commitMessage:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: Moved file metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/File'
                  error:
                    type: [object, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Vault or source file not found
        '409':
          description: Source changed, destination exists, or branch advance was rejected
  /v1/files/{path}:
    parameters:
    - $ref: '#/components/parameters/FilePath'
    - $ref: '#/components/parameters/ExpectedBranch'
    get:
      operationId: getFile
      summary: Get a file
      description: 'Returns the contents and metadata of a file in the user''s vault.

        '
      tags:
      - Files
      security:
      - bearerAuth: []
      responses:
        '200':
          description: File contents and metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/File'
                  error:
                    type: ["object", "null"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: File was not found
    put:
      operationId: updateFile
      summary: Update a file
      description: 'Updates an existing file and commits the change to the user''s

        GitHub repository.

        '
      tags:
      - Files
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFileRequest'
      responses:
        '200':
          description: File updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/File'
                  error:
                    type: ["object", "null"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: File was not found
        '409':
          description: File changed since the client last retrieved it
    delete:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedSha]
              properties:
                expectedBranch:
                  $ref: '#/components/schemas/ExpectedBranch'
                expectedSha:
                  type: string
                  minLength: 1
      operationId: deleteFile
      summary: Delete a file
      description: 'Deletes a file and commits the change to the user''s GitHub repository.

        '
      tags:
      - Files
      security:
      - bearerAuth: []
      responses:
        '204':
          description: File deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: File was not found
        '409':
          description: File changed since the client last retrieved it
  /v1/search:
    get:
      operationId: searchVault
      summary: Search the vault
      description: Searches the selected vault branch. The default branch uses GitHub code search; other branches use literal case-insensitive Markdown content scanning, limited to 100 notes of at most 1 MB each after the path filter. Over-limit or incomplete searches return an error rather than partial results.
      tags:
      - Search
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ExpectedBranch'
      - name: q
        in: query
        required: true
        description: Search query
        schema:
          type: string
          minLength: 1
      - name: path
        in: query
        required: false
        description: Optional path prefix used to limit the search
        schema:
          type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SearchResponse'
                  error:
                    type: ["object", "null"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Search is incomplete or exceeds safe scan limits; narrow the query or path filter
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The selected vault branch changed on another device (BRANCH_CHANGED)
  /v1/sync:
    post:
      operationId: syncVault
      summary: Verify remote vault availability
      description: Verifies the configured GitHub branch can be read. Clients replay their local mutation queue before this check; this endpoint does not read browser storage.
      tags:
      - Sync
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedBranch:
                  $ref: '#/components/schemas/ExpectedBranch'
      responses:
        '202':
          description: Synchronization accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SyncOperation'
                  error:
                    type: ["object", "null"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The selected vault branch changed on another device (BRANCH_CHANGED)
  /v1/sync/status:
    get:
      operationId: getSyncStatus
      summary: Get synchronization status
      description: 'Returns the current synchronization state for the user''s vault.

        '
      tags:
      - Sync
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ExpectedBranch'
      responses:
        '200':
          description: Synchronization status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SyncStatus'
                  error:
                    type: ["object", "null"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The selected vault branch changed on another device (BRANCH_CHANGED)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authenticated application session token.

        '
  parameters:
    ExpectedBranch:
      name: expectedBranch
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ExpectedBranch'
    Path:
      name: path
      in: query
      required: false
      description: 'Optional path used to limit the returned files and directories.

        '
      schema:
        type: string
    FilePath:
      name: path
      in: path
      required: true
      description: 'Repository-relative path to the requested file.


        The backend must validate and safely handle this path.

        '
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated user is not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ExpectedBranch:
      type: string
      minLength: 1
      description: The branch the client read or edited. If another device changed vault selection, the API rejects the operation with 409 BRANCH_CHANGED before GitHub access. Omitted for backward compatibility.
    Vault:
      type: object
      required:
      - id
      - owner
      - repository
      - branch
      properties:
        id:
          type: string
          format: uuid
        owner:
          type: string
        repository:
          type: string
        branch:
          type: string
    CreateVaultRequest:
      type: object
      required:
      - repository
      properties:
        mode:
          type: string
          enum: [create, connect]
          default: create
          description: Create a new private repository or connect an existing accessible private repository with write permission.
        owner:
          type: string
          description: Required for connect mode; GitHub user or organization owning the repository.
        branch:
          type: string
          description: Optional existing branch for connect mode; defaults to the repository's default branch.
        repository:
          type: string
          description: Name of the new or existing GitHub repository
        description:
          type: string
          description: Optional description for the repository
    File:
      type: object
      required:
      - path
      - type
      properties:
        path:
          type: string
          description: Repository-relative file path
        type:
          type: string
          enum:
          - file
          - directory
        name:
          type: string
        content:
          type: string
          description: Base64-encoded UTF-8 file contents when requested
        sha:
          type: string
          description: GitHub blob/file identifier used for change detection
        size:
          type: integer
          minimum: 0
        lastModified:
          type: string
          format: date-time
    FileList:
      type: object
      required:
      - path
      - entries
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/File'
    CreateFileRequest:
      type: object
      required:
      - path
      - content
      properties:
        expectedBranch:
          $ref: '#/components/schemas/ExpectedBranch'
        path:
          type: string
          minLength: 1
        content:
          type: string
          description: Base64-encoded UTF-8 file contents
        commitMessage:
          type: string
          minLength: 1
          maxLength: 200
    UpdateFileRequest:
      type: object
      required:
      - content
      - expectedSha
      properties:
        expectedBranch:
          $ref: '#/components/schemas/ExpectedBranch'
        content:
          type: string
          description: Base64-encoded UTF-8 file contents
        expectedSha:
          type: string
          description: 'SHA of the version the client expects to update.

            Used to detect concurrent modifications.

            '
        commitMessage:
          type: string
          minLength: 1
          maxLength: 200
    SearchResponse:
      type: object
      required:
      - query
      - results
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
    SearchResult:
      type: object
      required:
      - path
      properties:
        path:
          type: string
        title:
          type: string
        snippet:
          type: string
        score:
          type: number
          format: double
    SyncOperation:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/SyncState'
    SyncStatus:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/SyncState'
        lastSyncAt:
          type:
          - string
          - 'null'
          format: date-time
        message:
          type: string
    SyncState:
      type: string
      enum:
      - idle
      - pending
      - running
      - completed
      - failed
      - conflict
    Error:
      type: object
      properties:
        data:
          type: ["object", "null"]
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
    StoreTokenRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          description: GitHub OAuth provider token to store server-side
    TokenResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
